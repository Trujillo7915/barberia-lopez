<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería Lopez — Arquitectos de tu imagen</title>
  <link rel="icon" type="image/jpeg" href="./logo_barberia_lopez_hd.jpg">

  <!-- Tipografías Oficiales: Anthropic System (Editorial Serif + UI Sans + Technical Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Sistema de Diseño: Luxury Obsidian & Imperial Gold -->
  <link rel="stylesheet" href="./ui/styles/theme.css">
  <link rel="stylesheet" href="./ui/styles/animations.css">

  <!-- Estilos Críticos en Línea: Blindaje garantizado para navegadores móviles (Android / iOS) -->
  <style>
    body { background-color: #0a0b0d; color: #fbfaf7; }
    .modal-backdrop-custom { position: fixed; inset: 0; z-index: 50; background-color: rgba(10, 11, 13, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-window-custom { background-color: #12151b !important; border: 1px solid rgba(212, 175, 55, 0.35) !important; border-radius: 20px !important; width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto; padding: 24px; position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); color: #ffffff; }
    .barber-modal-choice { background-color: #161a22 !important; border: 1px solid rgba(212, 175, 55, 0.25) !important; border-radius: 14px !important; padding: 12px 14px !important; display: flex !important; align-items: center !important; gap: 12px !important; cursor: pointer !important; transition: all 0.2s ease !important; }
    .barber-modal-choice:hover { border-color: #d4af37 !important; background-color: #1c212b !important; }
    .barber-modal-choice.selected { border: 2px solid #d4af37 !important; background-color: rgba(212, 175, 55, 0.16) !important; box-shadow: 0 0 16px rgba(212, 175, 55, 0.25) !important; }
    .service-modal-choice { background-color: #161a22 !important; border: 1px solid rgba(212, 175, 55, 0.25) !important; border-radius: 14px !important; padding: 14px 16px !important; margin-bottom: 8px !important; cursor: pointer !important; display: flex !important; flex-direction: column !important; justify-content: space-between !important; gap: 6px !important; transition: all 0.2s ease !important; }
    .service-modal-choice:hover { border-color: #d4af37 !important; background-color: #1c212b !important; }
    .service-modal-choice.selected { border: 2px solid #d4af37 !important; background-color: rgba(212, 175, 55, 0.16) !important; box-shadow: 0 0 16px rgba(212, 175, 55, 0.25) !important; }
    .extra-option-choice { background-color: #161a22 !important; border: 1px solid rgba(212, 175, 55, 0.25) !important; border-radius: 12px !important; padding: 10px 14px !important; cursor: pointer !important; transition: all 0.2s ease !important; }
    .extra-option-choice:hover { border-color: #d4af37 !important; background-color: #1c212b !important; }
    .extra-option-choice.selected { border: 2px solid #d4af37 !important; background-color: rgba(212, 175, 55, 0.16) !important; box-shadow: 0 0 14px rgba(212, 175, 55, 0.22) !important; }
    .booking-price-summary { background-color: #141820 !important; border: 1px solid rgba(212, 175, 55, 0.35) !important; border-radius: 14px !important; padding: 16px !important; margin-top: 16px !important; margin-bottom: 16px !important; }
    .input-parchment { background-color: #161a22 !important; border: 1px solid rgba(212, 175, 55, 0.25) !important; border-radius: 8px !important; color: #ffffff !important; font-size: 15px !important; padding: 12px 16px !important; width: 100% !important; outline: none !important; }
    .input-parchment:focus { border-color: #d4af37 !important; box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2) !important; }

    /* Cargado de Pagina / Preloader con Logo Oficial de la Tienda y Barberia */
    #page-preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background-color: #0a0b0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.55s ease, transform 0.55s ease;
      will-change: opacity, transform;
    }
    #page-preloader.preloader-hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.025);
      pointer-events: none;
    }
    .preloader-halo {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.18) 0%, rgba(212, 175, 55, 0.04) 55%, transparent 75%);
      filter: blur(35px);
      pointer-events: none;
      animation: preloaderHaloPulse 3s ease-in-out infinite;
    }
    .preloader-emblem-wrap {
      position: relative;
      width: 128px;
      height: 128px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preloader-orbit-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(212, 175, 55, 0.16);
      border-top-color: #d4af37;
      border-right-color: rgba(212, 175, 55, 0.7);
      animation: preloaderSpin 1.8s cubic-bezier(0.4, 0.1, 0.4, 0.9) infinite;
    }
    .preloader-orbit-ring-secondary {
      position: absolute;
      inset: -13px;
      border-radius: 50%;
      border: 1px dashed rgba(212, 175, 55, 0.25);
      animation: preloaderSpinReverse 6s linear infinite;
    }
    .preloader-logo-img {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(212, 175, 55, 0.5);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 18px rgba(212, 175, 55, 0.22);
      display: block;
    }
    .preloader-bar-track {
      width: 200px;
      max-width: 80vw;
      height: 3px;
      background-color: #171b24;
      border-radius: 9999px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.28);
      position: relative;
      margin-top: 22px;
    }
    .preloader-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #b38f28 0%, #ffd700 50%, #b38f28 100%);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
      animation: preloaderSlide 1.6s ease-in-out infinite;
    }
    @keyframes preloaderSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes preloaderSpinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes preloaderSlide {
      0% { left: -45%; }
      50% { left: 35%; width: 55%; }
      100% { left: 105%; width: 45%; }
    }
    @keyframes preloaderHaloPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.65; }
      50% { transform: scale(1.18); opacity: 1; }
    }
  </style>
</head>
<body class="bg-[#0a0b0d] text-[#f5f3ef] min-h-screen antialiased selection:bg-[#d4af37] selection:text-[#0a0b0d]">

  <!-- Cargado de Pagina Inicial con Logo Oficial de la Tienda y Barberia -->
  <div id="page-preloader" aria-label="Cargando Barberia Lopez" role="status">
    <div class="preloader-halo"></div>

    <div class="preloader-emblem-wrap">
      <div class="preloader-orbit-ring-secondary"></div>
      <div class="preloader-orbit-ring"></div>
      <img 
        src="./logo_barberia_lopez_hd.jpg" 
        alt="Barberia Lopez Tienda Oficial" 
        class="preloader-logo-img"
        onerror="this.src='./logo_barberia_lopez.png'"
      >
    </div>

    <div class="mt-6 text-center flex flex-col items-center">
      <div class="font-serif-editorial text-lg sm:text-2xl font-normal tracking-[0.24em] text-[#ffffff] uppercase">
        Barberia Lopez
      </div>
      <div class="font-sans-ui text-[11px] sm:text-xs text-[#d4af37] tracking-[0.28em] uppercase mt-1.5 font-semibold">
        Tienda Oficial & Barberia Clasica
      </div>

      <div class="preloader-bar-track">
        <div class="preloader-bar-fill"></div>
      </div>

      <span class="font-sans-ui text-[10px] text-[#8a8275] tracking-wider uppercase mt-3">
        Iniciando tienda, catalogo y agenda...
      </span>
    </div>
  </div>

  <!-- Contenedor Raiz de la Aplicacion -->
  <div id="app-root"></div>

  <script>
    // Temporizador de seguridad: previene bloqueo si la conexion es lenta o estatica
    setTimeout(function() {
      var pl = document.getElementById('page-preloader');
      if (pl && !pl.classList.contains('preloader-hidden')) {
        pl.classList.add('preloader-hidden');
        setTimeout(function() { if (pl && pl.parentNode) pl.parentNode.removeChild(pl); }, 600);
      }
    }, 4000);
  </script>

  <!-- Bundle Transaccional Autonomo -->
  <script src="./bundle.js"></script>
</body>
</html>
