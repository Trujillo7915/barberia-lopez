<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería Lopez — Arquitectos de tu imagen</title>
  <link rel="icon" type="image/jpeg" href="./logo_barberia_lopez_hd.jpg">

  <!-- Tipografías Oficiales: Anthropic System (Editorial Serif + UI Sans + Technical Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Sistema de Diseño: Luxury Obsidian & Imperial Gold -->
  <link rel="stylesheet" href="./ui/styles/theme.css">
  <link rel="stylesheet" href="./ui/styles/animations.css">

  <!-- Estilos Críticos en Línea: Blindaje garantizado para navegadores móviles (Android / iOS) -->
  <style>
    body { background-color: #0a0b0d; color: #fbfaf7; }
    .modal-backdrop-custom { position: fixed; inset: 0; z-index: 50; background-color: rgba(10, 11, 13, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-window-custom { background-color: #12151b !important; border: 1px solid rgba(212, 175, 55, 0.35) !important; border-radius: 20px !important; width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto; padding: 24px; position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); color: #ffffff; }
    .barber-modal-choice { background-color: #161a22 !important; border: 1px solid rgba(212, 175, 55, 0.25) !important; border-radius: 14px !important; padding: 12px 14px !important; display: flex !important; align-items: center !important; gap: 12px !important; cursor: pointer !important; transition: all 0.2s ease !important; }
    .barber-modal-choice:hover { border-color: #d4af37 !important; background-color: #1c212b !important; }
    .barber-modal-choice.selected { border: 2px solid #d4af37 !important; background-color: rgba(212, 175, 55, 0.16) !important; box-shadow: 0 0 16px rgba(212, 175, 55, 0.25) !important; }
    .service-modal-choice { background-color: #161a22 !important; border: 1px solid rgba(212, 175, 55, 0.25) !important; border-radius: 14px !important; padding: 14px 16px !important; margin-bottom: 8px !important; cursor: pointer !important; display: flex !important; flex-direction: column !important; justify-content: space-between !important; gap: 6px !important; transition: all 0.2s ease !important; }
    .service-modal-choice:hover { border-color: #d4af37 !important; background-color: #1c212b !important; }
    .service-modal-choice.selected { border: 2px solid #d4af37 !important; background-color: rgba(212, 175, 55, 0.16) !important; box-shadow: 0 0 16px rgba(212, 175, 55, 0.25) !important; }
    .extra-option-choice { background-color: #161a22 !important; border: 1px solid rgba(212, 175, 55, 0.25) !important; border-radius: 12px !important; padding: 10px 14px !important; cursor: pointer !important; transition: all 0.2s ease !important; }
    .extra-option-choice:hover { border-color: #d4af37 !important; background-color: #1c212b !important; }
    .extra-option-choice.selected { border: 2px solid #d4af37 !important; background-color: rgba(212, 175, 55, 0.16) !important; box-shadow: 0 0 14px rgba(212, 175, 55, 0.22) !important; }
    .booking-price-summary { background-color: #141820 !important; border: 1px solid rgba(212, 175, 55, 0.35) !important; border-radius: 14px !important; padding: 16px !important; margin-top: 16px !important; margin-bottom: 16px !important; }
    .input-parchment { background-color: #161a22 !important; border: 1px solid rgba(212, 175, 55, 0.25) !important; border-radius: 8px !important; color: #ffffff !important; font-size: 15px !important; padding: 12px 16px !important; width: 100% !important; outline: none !important; }
    .input-parchment:focus { border-color: #d4af37 !important; box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2) !important; }
  </style>
</head>
<body class="bg-[#0a0b0d] text-[#f5f3ef] min-h-screen antialiased selection:bg-[#d4af37] selection:text-[#0a0b0d]">

  <!-- Contenedor Raíz de la Aplicación -->
  <div id="app-root"></div>

  <!-- Bundle Transaccional Autónomo -->
  <script src="./bundle.js"></script>
</body>
</html>
